            <form method="POST" action="https://atelier.osszcollection.com/tasks"
              x-data='{
                  orders: [{"id":"6ad14bdc-c6c1-4966-82c7-0d8d4fac0327","orderNumber":"OSSZ-2026-002","customerName":"Amina Cissé","customerPhone":"+237 699 551 122","orderDate":"09 Nov 2026","expectedDelivery":"09 Dec 2026","deliveryLocal":"2026-12-09T17:00","priority":"NORMAL","pieceCount":2,"instructions":"Embroidered neckline, matching trousers.","taskCount":2,"completedCount":0,"avgProgress":0},{"id":"af28fab7-699f-4865-89b0-b8ba86e63af5","orderNumber":"OSSZ-2026-001","customerName":"John Doe","customerPhone":"+237 677 123 456","orderDate":"26 Oct 2026","expectedDelivery":"25 Nov 2026","deliveryLocal":"2026-11-25T17:00","priority":"HIGH","pieceCount":3,"instructions":"Slim fit, midnight blue fabric, gold buttons.","taskCount":3,"completedCount":0,"avgProgress":40},{"id":"cc7ff7c6-4955-4f6e-8637-ed77c9d4b389","orderNumber":"OSSZ-2025-014","customerName":"Amina Cissé","customerPhone":"+237 699 551 122","orderDate":"01 Oct 2026","expectedDelivery":"03 Nov 2026","deliveryLocal":"2026-11-03T10:00","priority":"NORMAL","pieceCount":3,"instructions":"","taskCount":3,"completedCount":3,"avgProgress":100},{"id":"eef76f6c-f98a-41b9-a03f-6957c177d9c6","orderNumber":"OSSZ-2025-009","customerName":"John Doe","customerPhone":"+237 677 123 456","orderDate":"01 Sep 2026","expectedDelivery":"21 Sep 2026","deliveryLocal":"2026-09-21T10:00","priority":"NORMAL","pieceCount":1,"instructions":"","taskCount":1,"completedCount":1,"avgProgress":100}],
                  selectedId: "",
                  pieces: [],
                  errorsByIndex: [],
                  priorityLabels: {"LOW":"Low","NORMAL":"Normal","HIGH":"High","URGENT":"Urgent"},
                  priorityClasses: {"LOW":"bg-stone-50 text-stone-600 border-stone-300","NORMAL":"bg-teal-50 text-teal-700 border-teal-300","HIGH":"bg-amber-50 text-amber-800 border-amber-300","URGENT":"bg-red-50 text-red-800 border-red-300"},
                  templates: {"pieceNumber":"Piece {number}","removePiece":"Remove piece {number}","summaryOne":"{count} piece on order {order}","summaryMany":"{count} pieces on order {order}","createOne":"Create {count} Task","createMany":"Create {count} Tasks","existing":"{total} total ({completed} completed) — duplicate piece names are rejected.","existingProgress":"{total} total ({completed} completed, {progress}% average progress) — duplicate piece names are rejected.","pieceNamePlaceholder":"e.g. Jacket, Matching Trousers","instructionsPlaceholder":"Piece-specific production instructions","categoryForPiece":"Category for piece {number}","staffForPiece":"Staff for piece {number}","priorityForPiece":"Priority for piece {number}"},
                  init() {
                      if (this.pieces.length === 0) {
                          this.pieces = [this.makeRow(this.findOrder(this.selectedId))];
                      }
                  },
                  findOrder(id) {
                      for (var i = 0; i < this.orders.length; i++) {
                          if (this.orders[i].id === id) {
                              return this.orders[i];
                          }
                      }
                      return null;
                  },
                  get order() {
                      return this.findOrder(this.selectedId);
                  },
                  makeRow(order) {
                      return {
                          garmentPiece: "",
                          category: "FULL",
                          staffId: "",
                          priority: order !== null && order.priority ? order.priority : "NORMAL",
                          deadline: order !== null && order.deliveryLocal ? order.deliveryLocal : "",
                          instructions: ""
                      };
                  },
                  selectOrder(id) {
                      this.selectedId = id;
                      this.pieces = [this.makeRow(this.findOrder(id))];
                  },
                  addPiece() {
                      this.pieces.push(this.makeRow(this.order));
                  },
                  removePiece(index) {
                      if (this.pieces.length > 1) {
                          this.pieces.splice(index, 1);
                      }
                  },
                  existingSummary(order) {
                      if (order === null) {
                          return "";
                      }
                      if (order.taskCount > 0) {
                          return this.templates.existingProgress
                              .replace("{total}", order.taskCount)
                              .replace("{completed}", order.completedCount)
                              .replace("{progress}", order.avgProgress);
                      }
                      return this.templates.existing
                          .replace("{total}", order.taskCount)
                          .replace("{completed}", order.completedCount);
                  }
              }'>
